<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, minimum-scale=1.0, maximum-scale=1.0">
    <title>奶蛙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            border: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #fff !important;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 0 !important;
            margin-top: 0 !important;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .video-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            -webkit-user-drag: none;
        }
        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .loop-btn {
            background: #2a2a2a;
            color: #fff;
            border-radius: 8px;
            padding: 8px 24px;
            font-size: 16px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .settings-btn {
            background: #2a2a2a;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .icon-img {
            font-size: 22px;
            line-height: 1;
        }
        .stop-icon {
            font-size: 22px;
            display: none;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .settings-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .settings-content {
            background: #1a1a1a;
            border-radius: 24px;
            width: 85vw;
            max-width: 380px;
            padding: 28px 24px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 16px; right: 16px;
            width: 32px; height: 32px;
            background: transparent;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .settings-header {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            color: #fff;
            margin-bottom: 24px;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #333;
        }
        .setting-label {
            font-size: 18px;
            color: #fff;
        }
        .switch {
            width: 54px; height: 30px;
            background: #444;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .switch.active {
            background: #4cd964;
        }
        .switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 26px; height: 26px;
            background: #fff;
            border-radius: 50%;
            transition: 0.2s;
        }
        .switch.active::after {
            left: 26px;
        }
        .close-btn {
            display: none;
        }
    </style>
</head>
<body id="appBody">

<div class="video-container">
    <video id="mainVideo" src="Recovery.MP4" preload="auto" playsinline></video>
</div>

<div class="control-bar">
    <button class="loop-btn" id="loopBtn">
        <div id="loopIcon" class="icon-img">♻️</div>
        <div id="stopIcon" class="stop-icon">🚫</div>
        <span id="stateText">循环大笑</span>
    </button>
    <button class="settings-btn" id="settingsBtn">
        <div class="icon-img">⚙️</div>
    </button>
</div>

<div class="settings-modal" id="settingsModal">
    <div class="settings-content">
        <button class="close-modal" id="closeModal">×</button>
        <div class="settings-header">设置</div>
        <div class="setting-item">
            <span class="setting-label">音效</span>
            <div class="switch active" id="soundSwitch"></div>
        </div>
        <div class="setting-item" style="display:none;">
            <span class="setting-label">自动循环播放</span>
            <div class="switch" id="autoLoopSwitch"></div>
        </div>
        <div class="setting-item" style="display:none;">
            <span class="setting-label">高清画质</span>
            <div class="switch" id="hdSwitch"></div>
        </div>
        <button class="close-btn" id="closeSettings">确定</button>
    </div>
</div>

<script>
const video = document.getElementById('mainVideo');
const loopBtn = document.getElementById('loopBtn');
const loopIcon = document.getElementById('loopIcon');
const stopIcon = document.getElementById('stopIcon');
const stateText = document.getElementById('stateText');
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const closeModal = document.getElementById('closeModal');
const soundSwitch = document.getElementById('soundSwitch');

let isLooping = false;

video.addEventListener('loadeddata', () => {
  video.currentTime = 0;
  video.pause();
  video.muted = false;
});

loopBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  isLooping = !isLooping;

  if (isLooping) {
    loopIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    stateText.textContent = '停止喧哗';
    video.loop = true;
    video.currentTime = 0;
    video.play();
  } else {
    loopIcon.style.display = 'block';
    stopIcon.style.display = 'none';
    stateText.textContent = '循环大笑';
    video.loop = false;
    video.pause();
    video.currentTime = 0;
  }
});

document.body.addEventListener('click', (e) => {
  const isBtn = e.target.closest('.loop-btn, .settings-btn, .settings-modal');
  if (isBtn) return;
  if (isLooping) return;

  video.currentTime = 0;
  video.play();
  video.onended = () => {
    video.pause();
    video.currentTime = 0;
  };
});

settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsModal.style.display = 'flex';
});

closeModal.addEventListener('click', () => {
  settingsModal.style.display = 'none';
});

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.style.display = 'none';
});

soundSwitch.addEventListener('click', (e) => {
  e.stopPropagation();
  soundSwitch.classList.toggle('active');
  video.muted = !soundSwitch.classList.contains('active');
});

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
